; PlatformIO build for the flight computer. Builds everything under src/
; (the .ino sketches in the repo root are not part of it).
;   pio run                  build
;   pio run -t upload        build and flash over USB
;   pio device monitor       open the serial monitor

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; The code uses std::variant and if constexpr
build_unflags = -std=gnu++14
build_flags = -std=gnu++17 -Wall -Wextra -Isrc
monitor_speed = 115200
