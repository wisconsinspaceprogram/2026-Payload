; PlatformIO build for the flight computer. Builds everything under src/
; (the .ino sketches in the repo root are not part of it).
;   pio run                  build
;   pio run -t upload        build and flash over USB
;   pio device monitor       open the serial monitor

[platformio]
; `pio run` / `make build` build flight firmware only
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; The code uses std::variant and if constexpr
build_unflags = -std=gnu++14
build_flags = -std=gnu++17 -Wall -Wextra -Isrc
monitor_speed = 115200
; Command-line loader, so flashing works headless (e.g. on the Pi)
upload_protocol = teensy-cli

; Flight firmware plus the fake "sim.*" sensor, for testing telemetry
; without hardware:  pio run -e dummy -t upload
[env:dummy]
extends = env:teensy41
build_flags = ${env:teensy41.build_flags} -DDUMMY_DATA
